name: Build-scoped asset library tests

on:
  pull_request:
    branches: [beta]
    paths:
      - 'source/build_collections.py'
      - 'source/test_build_collections.py'
      - 'source/test_build_collections_qt.py'
      - 'source/test_build_transfer_dependencies.py'
      - 'source/build_transfer_dependencies.py'
      - 'source/legacy_stage2_transfer.py'
      - 'source/legacy_model_transfer.py'
      - 'source/test_legacy_stage2_transfer.py'
      - 'source/legacy_bulk_transfer.py'
      - 'source/test_legacy_bulk_transfer.py'
      - 'source/level_asset_mount.py'
      - 'source/qt_asset_library.py'
      - 'source/asset_library_preview.py'
      - 'source/asset_library.py'
      - 'source/multi_pak_assets.py'
      - 'source/asset_library_bulk.py'
      - '.github/workflows/build-scoped-asset-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded test dependencies
        run: python -m pip install cryptography Pillow numpy PySide6
      - name: Execute synthetic build tests
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/source
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v test_build_collections test_build_collections_qt test_build_transfer_dependencies test_legacy_stage2_transfer test_legacy_bulk_transfer
