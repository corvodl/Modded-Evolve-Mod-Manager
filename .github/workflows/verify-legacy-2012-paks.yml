name: Verify legacy 2012 PAK editing and contextual Qt UI
on:
  pull_request:
    branches: [beta]
    paths:
      - 'source/legacy_pak_workspace.py'
      - 'source/legacy_texture_preview.py'
      - 'source/qt_legacy_pak_editor.py'
      - 'source/qt_workspace_editor.py'
      - 'source/qt_gpu_viewer.py'
      - 'source/qt_gfx_editor.py'
      - 'source/qt_gfx_preview.py'
      - 'source/qt_manager.py'
      - 'source/test_legacy_pak_workspace.py'
      - 'source/test_qt_legacy_pak_editor.py'
      - 'source/test_contextual_toolbars.py'
      - '.github/workflows/verify-legacy-2012-paks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-editor:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install manager runtime requirements
        run: python -m pip install -r source/requirements.txt
      - name: Test historical ZIP PAK imports, edit/rebuild and Qt context controls
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/source
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q source
          if ($LASTEXITCODE -ne 0) { throw 'Legacy editor Python syntax failed' }
          python -m unittest -v test_legacy_pak_workspace test_qt_legacy_pak_editor test_contextual_toolbars
          if ($LASTEXITCODE -ne 0) { throw 'Legacy PAK and layout regression tests failed' }
