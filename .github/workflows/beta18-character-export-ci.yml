name: Validate Beta 18 Flat Character Export (non-publishing)

on:
  push:
    branches: [feature/beta18-flat-character-export-full-model]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta18-character-export
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q 'cryptography>=42,<50' pillow numpy PySide6
      - name: Compile changed modules
        run: |
          python -m py_compile source/character_full_models.py source/character_asset_export.py source/qt_workspace_editor.py source/async_model_resolve.py source/studio_polish_117.py
      - name: Run character export and existing model tests
        working-directory: source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v test_beta18_flat_character_models test_model_families test_beta17_character_library test_beta16_wraith_shared_textures test_textured_export test_beta15_animation_export
