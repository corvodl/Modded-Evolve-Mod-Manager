name: Verify Qt production candidate (no publication)

on:
  workflow_dispatch:
  push:
    branches: [qt-migration, fix-qt-font-glyphs, settings-sections-fast-launch, feature/mod-profiles-foundation, feature/blender-model-export-gpu-default, feature/cross-pak-textures-rig-readiness, feature/cryengine-rigged-gltf, feature/animation-playback-model-editor-ux, feature/embedded-full-gpu-viewer-maximize, feature/model-menubar-texture-diagnostics, feature/character-animation-catalog-composite, feature/visual-gameplay-profiles-assets-studio-v1-1-13, feature/v1-1-14-asset-intelligence-project-lifecycle, feature/v1-1-15-workflow-developer-lab, feature/v1-1-15-1-developer-write-optin-ui-captures, feature/v1.1.16-rendering-diagnostics-ui, feature/v1.1.17-performance-studio-polish, feature/stable-beta-installer-updater]

permissions:
  contents: read

concurrency:
  group: qt-production-candidate
  cancel-in-progress: true

jobs:
  full-windows-suite:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Full backend, legacy-regression and Qt GUI suite; package real application
        shell: cmd
        run: call Build-Windows-EXE.cmd
      - name: Capture actual compiled Qt manager
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          & '.build/app-dist/EvolveModManager/EvolveModManager.exe' --capture-screenshot 'dist/EvolveModManager-compiled-screenshot.png'
          if ($LASTEXITCODE -ne 0) { throw 'Production-candidate compiled Qt GUI failed to render.' }
          & '.build/venv/Scripts/python.exe' -c "from PIL import Image,ImageStat; im=Image.open('dist/EvolveModManager-compiled-screenshot.png').convert('RGB'); print(im.size); assert im.width>=850 and im.height>=600 and max(ImageStat.Stat(im).stddev)>14"
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Qt screenshot is invalid.' }
          & '.build/app-dist/EvolveModManager/EvolveModManager.exe' --capture-modding-screenshot 'dist/EvolveModManager-Modding-screenshot.png'
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'dist/EvolveModManager-Modding-screenshot.png')) { throw 'Compiled Modding page screenshot is invalid.' }
      - name: Validate portable ZIP and absence of private data
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $name = 'dist/EvolveModManager-Windows.zip'
          if (!(Test-Path $name)) { throw 'Portable EXE ZIP missing.' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $name))
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @(
              'EvolveModManager/EvolveModManager.exe',
              'EvolveModManager/EvolveModWorker.exe',
              'EvolveModManager/START-HERE.txt',
              'EvolveModManager/BUILD_COMMIT.txt',
              'EvolveModManager/BUILD_CHANNEL.txt')) {
                if ($required -notin $entries) { throw "Required Qt package file missing: $required" }
            }
            if ($entries | Where-Object { $_ -match '(?i)(^|/)Data/|private_key\.pem$|\.pak$|EvolveModLegacyEditor\.exe$' }) {
              throw 'Qt production candidate contains user game data or obsolete Tk editor executable.'
            }
            $reader = [System.IO.StreamReader]::new($zip.GetEntry('EvolveModManager/BUILD_CHANNEL.txt').Open())
            try { $channel = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            if ($channel -ne 'experimental') { throw "Dryrun must remain non-Main: $channel" }
          } finally { $zip.Dispose() }
      - name: Install or locate Inno Setup 6
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler install failed.' }
          }
      - name: Build candidate Windows installer
        shell: pwsh
        run: |
          & './installer/Build-Installer.ps1'
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'dist/EvolveModManager-Setup.exe')) {
            throw 'Candidate Windows setup build failed.'
          }
      - name: Upload verified production-candidate package and real screenshot
        uses: actions/upload-artifact@v4
        with:
          name: EvolveModManager-Qt-ProductionCandidate
          path: |
            dist/EvolveModManager-Windows.zip
            dist/EvolveModManager-Setup.exe
            dist/EvolveModManager-compiled-screenshot.png
            dist/EvolveModManager-Modding-screenshot.png
          if-no-files-found: error
          retention-days: 14
