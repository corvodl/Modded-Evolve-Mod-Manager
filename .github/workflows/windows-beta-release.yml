name: Build Windows Beta installer and publish prerelease

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "auto = patch same version, milestone = new version, patch = same version only"
        type: choice
        required: false
        default: auto
        options: [auto, milestone, patch]
  push:
    branches: [beta]

permissions:
  contents: write

concurrency:
  group: beta-windows-release-current
  cancel-in-progress: true

jobs:
  build-windows-beta:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Resolve beta milestone or patch revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MODE: ${{ inputs.publish_mode || 'auto' }}
        run: |
          $version=((Get-Content 'source/VERSION.txt' -Raw).Trim() -split ' - ',2)[0]
          New-Item -ItemType Directory -Force '.build/previous-release' | Out-Null
          gh release view Beta *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release download Beta --pattern update-manifest.json --dir .build/previous-release --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing rolling Beta manifest.' }
          }
          $args=@('source/release_revision.py','--version',$version,'--mode',$env:PUBLISH_MODE)
          if (Test-Path '.build/previous-release/update-manifest.json') {
            $args+=@('--previous','.build/previous-release/update-manifest.json')
          }
          $data=(& python @args | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $null -eq $data) { throw 'Revision selection failed.' }
          "EVOLVE_RELEASE_REVISION=$($data.revision)" >> $env:GITHUB_ENV
          "EVOLVE_RELEASE_TYPE=$($data.release_type)" >> $env:GITHUB_ENV
          Write-Host "Publishing beta milestone $version, revision $($data.revision) ($($data.release_type))."
      - name: Verify version is a beta prerelease
        shell: pwsh
        run: |
          $version=((Get-Content 'source/VERSION.txt' -Raw).Trim() -split ' - ', 2)[0]
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?-beta\.\d+$') {
            throw "The beta branch must publish an explicitly beta-numbered version."
          }
      - name: Validate beta release notes and changed Python modules
        shell: pwsh
        run: |
          python -m py_compile source/release_notes.py source/material_preview.py source/character_assembly.py source/qt_workspace_editor.py source/qt_gpu_viewer.py source/test_beta24_texture_provenance.py
          if ($LASTEXITCODE -ne 0) { throw "Python syntax check failed; refusing to build a beta installer." }
      - name: Build and test the real Windows executable
        shell: cmd
        run: call Build-Windows-EXE.cmd
      - name: Verify and capture compiled Windows application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='windows'
          function Capture-CompiledApp([string]$Mode,[string]$Destination) {
            $exe=(Resolve-Path '.build/app-dist/EvolveModManager/EvolveModManager.exe').Path
            $work=Split-Path -Path $exe -Parent
            $target=Join-Path (Get-Location) $Destination
            $process=Start-Process -FilePath $exe -ArgumentList @($Mode,$target) -WorkingDirectory $work -PassThru
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              $process.WaitForExit(10000) | Out-Null
              $log=Join-Path $env:LOCALAPPDATA 'EvolveModManagerQtPreview/startup.log'
              if (Test-Path $log) { Get-Content $log -Tail 70 }
              throw "Compiled Beta UI capture timed out: $Mode"
            }
            if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $Destination)) {
              throw "Compiled Beta UI capture failed: $Mode exit $($process.ExitCode)"
            }
          }
          Capture-CompiledApp '--capture-screenshot' 'dist/EvolveModManager-compiled-screenshot.png'
          Capture-CompiledApp '--capture-modding-screenshot' 'dist/EvolveModManager-Modding-screenshot.png'
          $channel=(Get-Content '.build/app-dist/EvolveModManager/BUILD_CHANNEL.txt' -Raw).Trim()
          if ($channel -ne 'beta') { throw "Unexpected executable channel: $channel" }
          Add-Type -AssemblyName System.IO.Compression
          $zip=[System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/EvolveModManager-Windows.zip'))
          try {
            $items=@($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($expected in @('EvolveModManager/EvolveModManager.exe',
                   'EvolveModManager/EvolveModWorker.exe',
                   'EvolveModManager/BUILD_COMMIT.txt',
                   'EvolveModManager/BUILD_CHANNEL.txt')) {
              if ($expected -notin $items) { throw "Incomplete beta package: $expected" }
            }
            if ($items | Where-Object { $_ -match '(?i)(^|/)Data/|private_key\.pem$|\.pak$' }) {
              throw 'Beta package includes private files or game data.'
            }
          } finally { $zip.Dispose() }
      - name: Install or locate Inno Setup
        shell: pwsh
        run: |
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup 6.' }
          }
      - name: Compile beta installer
        shell: pwsh
        run: |
          & './installer/Build-Installer.ps1'
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'dist/EvolveModManager-Setup.exe')) {
            throw 'Beta installer build failed.'
          }
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EvolveModManager-Beta-Installer
          path: |
            dist/EvolveModManager-Setup.exe
            dist/EvolveModManager-Windows.zip
            dist/EvolveModManager-compiled-screenshot.png
            dist/EvolveModManager-Modding-screenshot.png
          if-no-files-found: error
      - name: Prepare beta update manifest
        shell: pwsh
        run: |
          $version=((Get-Content 'source/VERSION.txt' -Raw).Trim() -split ' - ',2)[0]
          $revision=[int]$env:EVOLVE_RELEASE_REVISION
          $zipName="EvolveModManager-Windows-$($version)-p$($revision).zip"
          $setupName="EvolveModManager-Setup-$($version)-p$($revision).exe"
          Copy-Item 'dist/EvolveModManager-Windows.zip' "dist/$zipName" -Force
          Copy-Item 'dist/EvolveModManager-Setup.exe' "dist/$setupName" -Force
          $manifest=[ordered]@{
            schema=2
            channel='beta'
            commit='${{ github.sha }}'
            version=$version
            revision=$revision
            release_type=$env:EVOLVE_RELEASE_TYPE
            asset=$zipName
            sha256=(Get-FileHash -LiteralPath "dist/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
            bytes=(Get-Item -LiteralPath "dist/$zipName").Length
            installer=$setupName
            installer_sha256=(Get-FileHash -LiteralPath "dist/$setupName" -Algorithm SHA256).Hash.ToLowerInvariant()
            installer_bytes=(Get-Item -LiteralPath "dist/$setupName").Length
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/update-manifest.json'),
            ($manifest | ConvertTo-Json -Depth 3),[Text.UTF8Encoding]::new($false))
      - name: Publish Beta milestone only on new version and rolling patch (manifest last)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest=(gh api 'repos/${{ github.repository }}/branches/beta' --jq '.commit.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $latest -ne '${{ github.sha }}') {
            throw 'Beta branch moved; refusing to publish stale artifacts.'
          }
          $manifest=Get-Content 'dist/update-manifest.json' -Raw | ConvertFrom-Json
          $version=$manifest.version
          $revision=[int]$manifest.revision
          $zipName=$manifest.asset
          $setupName=$manifest.installer
          & '.build/venv/Scripts/python.exe' 'source/release_notes.py' --latest |
            Set-Content -Encoding utf8 'dist/release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare release notes.' }
          $versionTag="v$version"
          if ($revision -eq 0) {
            gh release view $versionTag *> $null
            if ($LASTEXITCODE -eq 0) { throw "Milestone $versionTag already exists; refusing to overwrite immutable versioned release." }
            gh release create $versionTag "dist/$setupName" "dist/$zipName" 'dist/update-manifest.json' --target '${{ github.sha }}' --title "Evolve Mod Manager $version (Beta)" --prerelease --notes-file 'dist/release-notes.md'
            if ($LASTEXITCODE -ne 0) { throw "Could not create milestone $versionTag." }
          } else {
            gh release view $versionTag *> $null
            if ($LASTEXITCODE -ne 0) { throw "Patch $revision requires existing milestone $versionTag." }
          }
          gh release view Beta *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create Beta --target '${{ github.sha }}' --title "Evolve Mod Manager $version (Beta)" --prerelease --notes 'Rolling verified beta updates.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create rolling Beta release.' }
          }
          foreach ($file in @($setupName,$zipName,'EvolveModManager-compiled-screenshot.png','EvolveModManager-Modding-screenshot.png')) {
            gh release upload Beta "dist/$file" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload $file." }
          }
          # Only the manifest authorizes the new package, publish it last.
          gh release upload Beta 'dist/update-manifest.json' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Beta manifest.' }
          gh release edit Beta --title "Evolve Mod Manager $version · Patch $revision (Beta)" --prerelease --notes-file 'dist/release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'Could not update rolling Beta notes.' }
          # Remove no-longer-current installers/ZIPs, without touching the
          # immutable numbered milestones. Do not retain redundant revisions.
          $names=@(gh release view Beta --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate previous Beta assets.' }
          foreach ($name in $names) {
            if (($name -like 'EvolveModManager-Windows*.zip' -and $name -ne $zipName) -or
                ($name -like 'EvolveModManager-Setup*.exe' -and $name -ne $setupName)) {
              gh release delete-asset Beta $name --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not clean outdated Beta asset $name." }
            }
          }
