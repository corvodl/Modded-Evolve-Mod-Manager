name: Verify beta.35 Asset Library project flows
on:
  pull_request:
    branches: [beta]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta35-library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-regressions:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install synthetic and Qt test dependencies
        shell: pwsh
        run: python -m pip install 'PySide6>=6.8,<6.11' 'cryptography>=41,<48' 'Pillow>=12,<13' 'numpy>=1.26,<3' 'PyOpenGL>=3.1.7,<4'
      - name: Compile and run focused regression suites
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/source
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q source
          python -m unittest -v test_beta35_project_flows test_asset_library_bulk test_build_collections test_qt_asset_preview test_qt_migration
