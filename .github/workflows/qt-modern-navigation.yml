name: Qt modern navigation and Settings checks

on:
  pull_request:
    branches: [beta]
    paths:
      - 'source/qt_manager.py'
      - 'source/qt_navigation_icons.py'
      - 'source/test_qt_modern_navigation.py'
      - 'source/library_map_actions.py'
      - 'source/test_library_map_actions.py'
      - '.github/workflows/qt-modern-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt test dependencies
        run: python -m pip install 'PySide6>=6.8,<6.11' 'Pillow>=12,<13' 'numpy>=1.26,<3' 'cryptography>=41,<48' 'PyOpenGL>=3.1.7,<4'
      - name: Compile and run synthetic Qt checks
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/source
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q source
          python -m unittest -v test_qt_modern_navigation test_library_map_actions
