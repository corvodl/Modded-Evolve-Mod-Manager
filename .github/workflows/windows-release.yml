name: Build Windows EXE and update release

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "auto = patch same version, milestone = new version, patch = same version only"
        type: choice
        required: false
        default: auto
        options: [auto, milestone, patch]
  push:
    branches: [main]

permissions:
  contents: write

# New pushes must not publish an older build over a newer successful release.
concurrency:
  group: main-windows-release
  cancel-in-progress: true

jobs:
  # Recover an already-published rolling patch (notably v1.2.5-p1) as an
  # immutable versioned release, without rebuilding or changing its artifacts.
  # This runs independently of the slower Windows build for the next patch.
  promote-existing-patch:
    name: Promote existing stable patch to latest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish existing Main patch under a versioned tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view Main >/dev/null 2>&1; then
            echo 'No rolling Main release exists yet.'
            exit 0
          fi
          mkdir -p promotion
          gh release download Main --pattern update-manifest.json --dir promotion
          manifest=promotion/update-manifest.json
          version=$(jq -er '.version' "$manifest")
          revision=$(jq -er '.revision' "$manifest")
          if [[ "$revision" == "0" ]]; then
            echo 'Milestone has no patch to promote.'
            exit 0
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Invalid stable version'; exit 1; }
          [[ "$revision" =~ ^[1-9][0-9]{0,4}$ ]] || { echo 'Invalid patch revision'; exit 1; }
          patchTag="v${version}-p${revision}"
          if gh release view "$patchTag" >/dev/null 2>&1; then
            echo "$patchTag already exists; retaining its original assets."
            exit 0
          fi
          setupName=$(jq -er '.installer' "$manifest")
          zipName=$(jq -er '.asset' "$manifest")
          commit=$(jq -er '.commit' "$manifest")
          [[ "$setupName" == "EvolveModManager-Setup-${version}-p${revision}.exe" ]] || exit 1
          [[ "$zipName" == "EvolveModManager-Windows-${version}-p${revision}.zip" ]] || exit 1
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh release download Main --pattern "$setupName" --pattern "$zipName" --dir promotion
          for pair in "setup:$setupName:installer_sha256:installer_bytes" "zip:$zipName:sha256:bytes"; do
            IFS=: read -r kind filename shaField bytesField <<< "$pair"
            wantedSha=$(jq -er --arg name "$shaField" '.[$name]' "$manifest")
            wantedBytes=$(jq -er --arg name "$bytesField" '.[$name]' "$manifest")
            actualSha=$(sha256sum "promotion/$filename" | cut -d' ' -f1)
            actualBytes=$(stat -c%s "promotion/$filename")
            [[ "$actualSha" == "$wantedSha" && "$actualBytes" == "$wantedBytes" ]] || {
              echo "Rolling Main $kind checksum/size mismatch; refusing promotion."
              exit 1
            }
          done
          gh api "repos/${{ github.repository }}/commits/$commit" --silent
          gh release view Main --json body --jq '.body' > promotion/release-notes.md
          gh release create "$patchTag" "promotion/$setupName" "promotion/$zipName" "$manifest" \
            --target "$commit" --title "Evolve Mod Manager $version · Patch $revision" \
            --notes-file promotion/release-notes.md --latest
          gh release view "$patchTag" --json tagName,assets,isLatest --jq '{tag: .tagName, latest: .isLatest, assets: [.assets[].name]}'

  build-windows:
    name: Build portable Windows app
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Install LGPL native bulk Twofish via signed MSYS2 packages
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-libgpg-error
      - name: Resolve stable milestone or patch revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MODE: ${{ inputs.publish_mode || 'auto' }}
        run: |
          $version=((Get-Content 'source/VERSION.txt' -Raw).Trim() -split ' - ',2)[0]
          New-Item -ItemType Directory -Force '.build/previous-release' | Out-Null
          gh release view Main *> $null
          if ($LASTEXITCODE -eq 0) {
            $existingAssets=@(gh release view Main --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect rolling Main release.' }
            if ($existingAssets -contains 'update-manifest.json') {
              gh release download Main --pattern update-manifest.json --dir .build/previous-release --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing Main manifest.' }
            } else {
              Write-Host 'Legacy Main release has no revision manifest. Bootstrapping its first immutable milestone at revision 0.'
            }
          }
          $args=@('source/release_revision.py','--version',$version,'--mode',$env:PUBLISH_MODE)
          if (Test-Path '.build/previous-release/update-manifest.json') {
            $args+=@('--previous','.build/previous-release/update-manifest.json')
          }
          $data=(& python @args | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $null -eq $data) { throw 'Revision selection failed.' }
          "EVOLVE_RELEASE_REVISION=$($data.revision)" >> $env:GITHUB_ENV
          "EVOLVE_RELEASE_TYPE=$($data.release_type)" >> $env:GITHUB_ENV
          Write-Host "Publishing stable milestone $version, revision $($data.revision) ($($data.release_type))."
      - name: Build and test EXE
        shell: cmd
        env:
          EVOLVE_REQUIRE_NATIVE_TWOFISH: '1'
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: call Build-Windows-EXE.cmd
      - name: Verify GUI launches without a dependent console
        shell: pwsh
        run: |
          function Get-PeSubsystem([string]$file) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $file))
            if ($bytes.Length -lt 256 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) {
              throw "Invalid Windows executable: $file"
            }
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($pe -lt 64 -or $pe + 96 -gt $bytes.Length) {
              throw "Invalid PE header: $file"
            }
            return [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          }
          $gui = Get-PeSubsystem '.build/app-dist/EvolveModManager/EvolveModManager.exe'
          $worker = Get-PeSubsystem '.build/app-dist/EvolveModManager/EvolveModWorker.exe'
          if ($gui -ne 2) { throw "Manager must use Windows GUI subsystem (2); got $gui." }
          if ($worker -ne 3) { throw "Worker must retain Windows console subsystem (3); got $worker." }
          Write-Host 'Verified GUI process has no dependent command prompt; worker remains console-capable.'
      - name: Capture native Windows Qt UI without bypassing packaged GUI UAC
        shell: pwsh
        run: |
          # EvolveModManager.exe explicitly requires UAC. A headless CI runner
          # cannot consent to that prompt. Capture native Windows Qt widgets
          # from the exact checked-out source used to build the package; keep
          # the compiled PE subsystem and distribution checks in other steps.
          $env:QT_QPA_PLATFORM = "windows"
          $spec = Get-Content 'source/EvolveModManager.spec' -Raw
          if (!$spec.Contains("uac_admin=(entry == 'qt_manager')")) {
            throw "Packaged manager must request administrator permission."
          }
          & '.build/venv/Scripts/python.exe' 'source/qt_manager.py' '--capture-screenshot' 'dist/EvolveModManager-compiled-screenshot.png'
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'dist/EvolveModManager-compiled-screenshot.png')) {
            throw 'Native Windows Qt Home capture failed.'
          }
          & ".build/venv/Scripts/python.exe" -c "from PIL import Image,ImageStat; p=Image.open('dist/EvolveModManager-compiled-screenshot.png').convert('RGB'); assert p.width>=850 and p.height>=600; assert max(ImageStat.Stat(p).stddev)>14"
          if ($LASTEXITCODE -ne 0) { throw 'Native Qt screenshot was blank or invalid.' }
          & '.build/venv/Scripts/python.exe' 'source/qt_manager.py' '--capture-modding-screenshot' 'dist/EvolveModManager-Modding-screenshot.png'
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'dist/EvolveModManager-Modding-screenshot.png')) {
            throw 'Native Windows Qt Modding capture failed.'
          }
      - name: Publish real compiled UI screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvolveModManager-Actual-Windows-Screenshot
          path: |
            dist/EvolveModManager-compiled-screenshot.png
            dist/EvolveModManager-Modding-screenshot.png
          if-no-files-found: error
      - name: Verify release ZIP
        shell: pwsh
        run: |
          $file = "dist/EvolveModManager-Windows.zip"
          if (!(Test-Path $file)) { throw "Portable Windows ZIP was not generated." }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $file))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @("EvolveModManager/EvolveModManager.exe", "EvolveModManager/EvolveModWorker.exe", "EvolveModManager/BUILD_COMMIT.txt", "EvolveModManager/BUILD_CHANNEL.txt")) {
              if ($names -notcontains $required) { throw "Missing application file: $required" }
            }
            if (!($names | Where-Object { $_ -like "EvolveModManager/_internal/*" })) {
              throw "Bundled runtime folder is missing."
            }
            if ($names | Where-Object { $_ -cmatch '^EvolveModManager/Data/' -or $_ -match '(?i)(^|/)private_key[.]pem$|[.]pak$' }) {
              throw "Release contains private game data or generated keys."
            }
            $commit = $zip.GetEntry('EvolveModManager/BUILD_COMMIT.txt')
            $reader = [System.IO.StreamReader]::new($commit.Open())
            try { $embedded = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            if ($embedded -ne '${{ github.sha }}') { throw "Build commit does not match workflow commit" }
          }
          finally { $zip.Dispose() }
          Write-Host "Windows portable release verified."
      - name: Locate Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup compiler.' }
          }
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          & './installer/Build-Installer.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $file = 'dist/EvolveModManager-Setup.exe'
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $file))
          if ($bytes.Length -lt 1048576 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) {
            throw 'Installer is missing or is not a valid Windows EXE.'
          }
      - name: Save downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvolveModManager-Windows
          path: |
            dist/EvolveModManager-Setup.exe
            dist/EvolveModManager-Windows.zip
          if-no-files-found: error
      - name: Prepare revision-specific stable release manifest
        shell: pwsh
        run: |
          $version=((Get-Content 'source/VERSION.txt' -Raw).Trim() -split ' - ',2)[0]
          $revision=[int]$env:EVOLVE_RELEASE_REVISION
          $zipName="EvolveModManager-Windows-$($version)-p$($revision).zip"
          $setupName="EvolveModManager-Setup-$($version)-p$($revision).exe"
          Copy-Item 'dist/EvolveModManager-Windows.zip' "dist/$zipName" -Force
          Copy-Item 'dist/EvolveModManager-Setup.exe' "dist/$setupName" -Force
          $data=[ordered]@{
            schema=2
            channel='main'
            commit='${{ github.sha }}'
            version=$version
            revision=$revision
            release_type=$env:EVOLVE_RELEASE_TYPE
            asset=$zipName
            sha256=(Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
            bytes=(Get-Item "dist/$zipName").Length
            installer=$setupName
            installer_sha256=(Get-FileHash "dist/$setupName" -Algorithm SHA256).Hash.ToLowerInvariant()
            installer_bytes=(Get-Item "dist/$setupName").Length
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/update-manifest.json'),
            ($data | ConvertTo-Json -Depth 3),[Text.UTF8Encoding]::new($false))
      - name: Publish stable milestone only on new version; rolling patches (manifest last)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest=(gh api 'repos/${{ github.repository }}/branches/main' --jq '.commit.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $latest -ne '${{ github.sha }}') {
            throw 'Main branch moved; refusing to publish stale artifacts.'
          }
          $manifest=Get-Content 'dist/update-manifest.json' -Raw | ConvertFrom-Json
          $version=$manifest.version
          $revision=[int]$manifest.revision
          $zipName=$manifest.asset
          $setupName=$manifest.installer
          & '.build/venv/Scripts/python.exe' source/release_notes.py --latest |
            Set-Content -Encoding utf8 'dist/release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'Release notes generation failed.' }
          $versionTag="v$version"
          if ($revision -eq 0) {
            gh release view $versionTag *> $null
            if ($LASTEXITCODE -eq 0) { throw "Milestone $versionTag already exists; refusing to overwrite it." }
            gh release create $versionTag "dist/$setupName" "dist/$zipName" 'dist/update-manifest.json' --target '${{ github.sha }}' --title "Evolve Mod Manager $version" --notes-file 'dist/release-notes.md'
            if ($LASTEXITCODE -ne 0) { throw "Could not create milestone $versionTag." }
          } else {
            gh release view $versionTag *> $null
            if ($LASTEXITCODE -ne 0) { throw "Patch requires existing milestone $versionTag." }
          }
          gh release view Main *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create Main --target '${{ github.sha }}' --title "Evolve Mod Manager $version" --notes 'Rolling stable updates.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create rolling Main release.' }
          }
          foreach ($file in @($setupName,$zipName,'EvolveModManager-compiled-screenshot.png','EvolveModManager-Modding-screenshot.png')) {
            gh release upload Main "dist/$file" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $file." }
          }
          gh release upload Main 'dist/update-manifest.json' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish stable manifest.' }
          gh release edit Main --title "Evolve Mod Manager $version · Patch $revision" --notes-file 'dist/release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'Could not update rolling Main notes.' }
          $names=@(gh release view Main --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate Main assets.' }
          foreach ($name in $names) {
            if (($name -like 'EvolveModManager-Windows*.zip' -and $name -ne $zipName) -or
                ($name -like 'EvolveModManager-Setup*.exe' -and $name -ne $setupName)) {
              gh release delete-asset Main $name --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove outdated Main asset $name." }
            }
          }
          # Keep Main as the rolling update feed, but publish every verified
          # stable patch as its own immutable release. GitHub's Latest badge
          # must point to the newest version/revision, not the old Main tag.
          if ($revision -gt 0) {
            $patchTag="v$version-p$revision"
            gh release view $patchTag *> $null
            if ($LASTEXITCODE -eq 0) {
              throw "Patch $patchTag already exists; refusing to replace immutable release."
            }
            gh release create $patchTag "dist/$setupName" "dist/$zipName" 'dist/update-manifest.json' --target '${{ github.sha }}' --title "Evolve Mod Manager $version · Patch $revision" --notes-file 'dist/release-notes.md' --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not publish latest patch release $patchTag." }
          } else {
            gh release edit $versionTag --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not mark milestone $versionTag as latest." }
          }
      - name: Remove obsolete source-only release ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(gh release view Main --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not list release assets." }
          if ($assets -contains "Evolve_Stage2_Mod_Manager.zip") {
            gh release delete-asset Main "Evolve_Stage2_Mod_Manager.zip" --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove obsolete release ZIP." }
          }
