name: Build Windows EXE and update release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# New pushes must not publish an older build over a newer successful release.
concurrency:
  group: main-windows-release
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build portable Windows app
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Build and test EXE
        shell: cmd
        run: call Build-Windows-EXE.cmd
      - name: Capture real compiled app window (Windows)
        shell: pwsh
        run: |
          # Capture genuine Qt widgets rendered by the compiled Windows executable.
          # Offscreen Qt previously rendered square replacement glyphs.
          # Use the real Windows platform/font backend instead.
          $env:QT_QPA_PLATFORM = "windows"
          & ".build/app-dist/EvolveModManager/EvolveModManager.exe" `
            --capture-screenshot "dist/EvolveModManager-compiled-screenshot.png"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not capture the actual compiled Qt manager window."
          }
          & ".build/venv/Scripts/python.exe" -c "from PIL import Image,ImageStat; p=Image.open('dist/EvolveModManager-compiled-screenshot.png').convert('RGB'); assert p.width>=850 and p.height>=600; assert max(ImageStat.Stat(p).stddev)>14"
          if ($LASTEXITCODE -ne 0) { throw "Compiled Qt screenshot was blank or invalid." }
          if (!(Test-Path "dist/EvolveModManager-compiled-screenshot.png")) {
            throw "Real manager screenshot was not created."
          }
          & ".build/app-dist/EvolveModManager/EvolveModManager.exe" `
            --capture-modding-screenshot "dist/EvolveModManager-Modding-screenshot.png"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "dist/EvolveModManager-Modding-screenshot.png")) {
            throw "Real Modding page screenshot was not created."
          }
      - name: Publish real compiled UI screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvolveModManager-Actual-Windows-Screenshot
          path: |
            dist/EvolveModManager-compiled-screenshot.png
            dist/EvolveModManager-Modding-screenshot.png
          if-no-files-found: error
      - name: Verify release ZIP
        shell: pwsh
        run: |
          $file = "dist/EvolveModManager-Windows.zip"
          if (!(Test-Path $file)) { throw "Portable Windows ZIP was not generated." }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $file))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @("EvolveModManager/EvolveModManager.exe", "EvolveModManager/EvolveModWorker.exe", "EvolveModManager/BUILD_COMMIT.txt", "EvolveModManager/BUILD_CHANNEL.txt")) {
              if ($names -notcontains $required) { throw "Missing application file: $required" }
            }
            if (!($names | Where-Object { $_ -like "EvolveModManager/_internal/*" })) {
              throw "Bundled runtime folder is missing."
            }
            if ($names | Where-Object { $_ -cmatch '^EvolveModManager/Data/' -or $_ -match '(?i)(^|/)private_key[.]pem$|[.]pak$' }) {
              throw "Release contains private game data or generated keys."
            }
            $commit = $zip.GetEntry('EvolveModManager/BUILD_COMMIT.txt')
            $reader = [System.IO.StreamReader]::new($commit.Open())
            try { $embedded = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            if ($embedded -ne '${{ github.sha }}') { throw "Build commit does not match workflow commit" }
          }
          finally { $zip.Dispose() }
          Write-Host "Windows portable release verified."
      - name: Locate Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup compiler.' }
          }
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          & './installer/Build-Installer.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $file = 'dist/EvolveModManager-Setup.exe'
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $file))
          if ($bytes.Length -lt 1048576 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) {
            throw 'Installer is missing or is not a valid Windows EXE.'
          }
      - name: Save downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvolveModManager-Windows
          path: |
            dist/EvolveModManager-Setup.exe
            dist/EvolveModManager-Windows.zip
          if-no-files-found: error
      - name: Prepare signed-by-checksum update manifest
        shell: pwsh
        run: |
          $zip = "dist/EvolveModManager-Windows.zip"
          $data = [ordered]@{
            schema = 1
            channel = 'main'
            commit = '${{ github.sha }}'
            version = (Get-Content -LiteralPath 'source/VERSION.txt' -Raw).Trim()
            asset = 'EvolveModManager-Windows.zip'
            sha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            bytes = (Get-Item -LiteralPath $zip).Length
            installer = 'EvolveModManager-Setup.exe'
            installer_sha256 = (Get-FileHash -LiteralPath 'dist/EvolveModManager-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
            installer_bytes = (Get-Item -LiteralPath 'dist/EvolveModManager-Setup.exe').Length
          }
          $json = $data | ConvertTo-Json -Depth 3
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/update-manifest.json'), $json, [System.Text.UTF8Encoding]::new($false))
      - name: Publish matching verified Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = (gh api 'repos/${{ github.repository }}/branches/main' --jq '.commit.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $latest -ne '${{ github.sha }}') {
            throw "Main branch moved since this build; refusing to publish stale binaries."
          }
          gh release upload Main "dist/EvolveModManager-Setup.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Installer release upload failed." }
          gh release upload Main "dist/EvolveModManager-Windows.zip" --clobber
          if ($LASTEXITCODE -ne 0) { throw "ZIP release upload failed." }
          gh release upload Main "dist/EvolveModManager-compiled-screenshot.png" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Compiled Windows screenshot upload failed." }
          gh release upload Main "dist/EvolveModManager-Modding-screenshot.png" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Modding page screenshot upload failed." }
          # Upload manifest LAST: old manifests never authorize new, mismatched bytes.
          gh release upload Main "dist/update-manifest.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Update manifest upload failed." }
          # Main remains the stable updater channel; keep its displayed release
          # title in sync with the verified version manifest.
          $version = ((Get-Content -LiteralPath 'source/VERSION.txt' -Raw).Trim() -split ' - ', 2)[0]
          & ".build/venv/Scripts/python.exe" source/release_notes.py --latest | Set-Content -Encoding utf8 "dist/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare public release notes." }
          gh release edit Main --title "Evolve Mod Manager v$version" --notes-file "dist/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "Failed to update the displayed release version." }
      - name: Remove obsolete source-only release ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(gh release view Main --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not list release assets." }
          if ($assets -contains "Evolve_Stage2_Mod_Manager.zip") {
            gh release delete-asset Main "Evolve_Stage2_Mod_Manager.zip" --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove obsolete release ZIP." }
          }
