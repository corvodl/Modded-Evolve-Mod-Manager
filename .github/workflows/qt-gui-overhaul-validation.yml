name: Validate Patch 2 native Qt redesign (non-publishing)

on:
  pull_request:
    branches: [main, beta]
    paths:
      - 'source/qt_*.py'
      - 'source/system_health.py'
      - 'source/system_health_extras.py'
      - 'source/test_system_health_extras.py'
      - 'source/test_system_health.py'
      - 'source/requirements.txt'
      - 'source/developer_*.py'
      - 'source/test_developer_console_windows.py'
      - 'source/test_unmodded_launch.py'
      - 'source/launch_integration.py'
      - 'source/test_qt_*.py'
      - 'source/test_version_info.py'
      - 'source/version_info.py'
      - 'source/blender_addon_installer.py'
      - 'source/test_blender_addon_installer.py'
      - '.github/workflows/qt-gui-overhaul-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-qt:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/source
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install supported Qt regression dependencies
        shell: pwsh
        run: python -m pip install 'Pillow>=12,<13' 'PySide6>=6.8,<6.11' 'cryptography>=41,<48' 'numpy>=1.26,<3' 'PyOpenGL>=3.1.7,<4' 'twofish>=0.3.0' 'psutil>=6,<8'
      - name: Compile all Python sources
        run: python -m compileall -q source
      - name: Exercise design system, workspaces and protected navigation
        shell: pwsh
        run: |
          python -m unittest -v test_system_health test_system_health_extras test_qt_system_health_polish test_qt_project_lifecycle_admin test_auto_restore_watch test_qt_quick_launch test_qt_design_system test_version_info test_blender_addon_installer test_qt_migration test_qt_modern_navigation test_qt_unified_explorer test_qt_gfx_editor test_qt_level_editor test_developer_console_windows test_unmodded_launch test_model_cancellation test_performance_trace test_model_progressive_uploads test_pak_streaming test_native_twofish_bulk test_level_residency_performance test_level_working_set test_performance_benchmarks test_level_early_publication test_qt_virtual_tree test_model_dependency_fingerprint test_model_geometry_stage test_model_deep_cancellation test_background_warmups
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI regression suite failed.' }
      - name: Capture actual Qt Windows widgets at four major pages
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/gui-review | Out-Null
          $screens = @(
            @('--capture-screenshot', 'dist/gui-review/home.png'),
            @('--capture-modding-screenshot', 'dist/gui-review/modding.png'),
            @('--capture-library-screenshot', 'dist/gui-review/asset-library.png'),
            @('--capture-settings-screenshot', 'dist/gui-review/settings.png')
          )
          foreach ($screen in $screens) {
            & python source/qt_manager.py $screen[0] $screen[1]
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $screen[1])) {
              throw "Qt screenshot failed: $($screen[1])"
            }
            $item = Get-Item $screen[1]
            if ($item.Length -lt 10000) {
              throw "Qt screenshot looks incomplete: $($screen[1])"
            }
          }
      - name: Upload screenshots for design review, not release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch2-native-qt-screenshots
          path: dist/gui-review/*.png
          if-no-files-found: warn
          retention-days: 14
