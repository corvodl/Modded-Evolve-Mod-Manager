name: Verify rendered level scene

on:
  pull_request:
    branches: [beta]
    paths:
      - "source/level_*"
      - "source/blender_native_project.py"
      - "source/ci_blender_scene_roundtrip.py"
      - "source/qt_level_*"
      - "source/material_preview.py"
      - "Build-Windows-EXE.cmd"
      - ".github/workflows/rendered-level-scene.yml"
  workflow_dispatch:

jobs:
  scene-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: |
          python -m py_compile source/level_terrain_decode.py source/level_dependency_loader.py source/level_blender_export.py source/level_asset_mount.py source/level_source_metadata.py source/qt_level_scene_render.py source/qt_level_editor.py source/level_editor_core.py source/material_preview.py
      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libgl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-randr0 libxcb-image0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libx11-xcb1 libdbus-1-3 xvfb
      - name: Install read-only editor smoke dependencies
        run: python -m pip install PySide6 numpy Pillow PyOpenGL cryptography
      - name: Run synthetic level asset/hierarchy regressions
        env:
          PYTHONPATH: source
        run: |
          python -m unittest -v test_level_blender_export test_level_asset_mount test_level_dependency_loader test_level_terrain_decode test_level_source_metadata test_level_editor test_qt_level_editor test_level_working_set test_level_residency_performance
          python -m unittest discover -s tests -p 'test_level_scene_core.py' -v
      - name: Rasterize synthetic mesh in actual software OpenGL context
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' env QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb PYTHONPATH=source python -m unittest -v test_qt_level_renderer

  blender-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native Blender binary and exporter requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          python -m pip install numpy Pillow
      - name: Import and reopen a combined-map GLB as real Blender project
        env:
          PYTHONPATH: source
        run: |
          python source/ci_blender_scene_roundtrip.py "$(command -v blender)"
