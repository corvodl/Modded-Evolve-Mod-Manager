name: Validate experimental asset editing

on:
  push:
    branches:
      - feature/asset-editing-v2-8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Run all tests, compile, and package
        shell: cmd
        run: call Build-Windows-EXE.cmd
      - name: Check portable app output
        shell: pwsh
        run: |
          $zip = "dist/EvolveModManager-Windows.zip"
          if (!(Test-Path $zip)) { throw "Missing Windows application ZIP" }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($item in @("EvolveModManager/EvolveModManager.exe", "EvolveModManager/EvolveModWorker.exe")) {
              if ($names -notcontains $item) { throw "Missing $item" }
            }
            # Only manager-owned Data/ is personal; NumPy's bundled tests/data/
            # is not user data. Still reject .pak archives and signing private keys
            # ANYWHERE in the release.
            $excluded = @($names | Where-Object {
              $_ -cmatch '^EvolveModManager/Data/' -or
              $_ -match '(?i)(^|/)private_key[.]pem$' -or
              $_ -match '(?i)[.]pak$'
            })
            if ($excluded.Count -gt 0) {
              $excluded | ForEach-Object { Write-Host "Excluded release file: $_" }
              throw "Release contains user data, personal keys, or game PAKs"
            }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: EvolveModManager-v2.8-experimental
          path: dist/EvolveModManager-Windows.zip
          if-no-files-found: error
