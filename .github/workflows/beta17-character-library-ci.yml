name: Verify Beta 17 character texture mapping and readable PAK folders

on:
  push:
    branches: [feature/beta17-texture-library-readable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta17-texture-library
  cancel-in-progress: true

jobs:
  library-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview and fixture requirements
        run: python -m pip install -q "cryptography>=42,<50" pillow numpy PySide6
      - name: Compile modified sources
        run: |
          python -m py_compile source/asset_library.py source/asset_library_preview.py source/material_preview.py source/model_material_resolve.py source/multi_pak_assets.py source/character_aliases.py source/pak_dependencies.py source/qt_workspace_editor.py source/qt_manager.py source/test_beta17_character_library.py
      - name: Verify texture resolutions and legacy archive migration
        working-directory: source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v test_beta17_character_library test_beta16_wraith_shared_textures test_beta10_library_model_material test_material_preview test_multi_pak_assets test_asset_library test_asset_library_preview test_beta13_layered_aliases
